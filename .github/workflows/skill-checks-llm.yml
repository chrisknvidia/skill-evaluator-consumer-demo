name: Skill checks with LLM
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider for your repository's LLM_API_KEY secret
        type: choice
        default: openai
        options: [openai, anthropic, nv_build]
      model:
        description: Optional model override
        type: string
        default: ''
permissions:
  contents: read
jobs:
  skills:
    uses: chrisknvidia/SkillEvaluator-ci-demo/.github/workflows/evaluate-skills.yml@48cceecb6533d6d3ec785b0e62c45f0a74a9d5ec
    with:
      paths: skills
      llm: true
      llm-provider: ${{ inputs.provider }}
      llm-model: ${{ inputs.model }}
      artifact-name: skill-evaluator-tier1-llm
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
